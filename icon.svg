<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="112" fill="#0f0f0f"/>
  <rect width="512" height="512" rx="112" fill="url(#grain)" opacity="0.03"/>
  
  <!-- Subtle border -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#2a2a2a" stroke-width="4"/>

  <!-- Decorative arc (echoing the dial) -->
  <path d="M 156 370 A 140 140 0 1 1 356 370" fill="none" stroke="#1e1e1e" stroke-width="28" stroke-linecap="round"/>
  <path d="M 156 370 A 140 140 0 0 1 256 116" fill="none" stroke="#c8b89a" stroke-width="28" stroke-linecap="round" opacity="0.6"/>

  <!-- € symbol -->
  <text x="256" y="306" 
        font-family="Georgia, serif" 
        font-size="210" 
        font-weight="bold"
        fill="#c8b89a"
        text-anchor="middle"
        dominant-baseline="middle">€</text>

  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
</svg>
